name: velio
description: Velio Group Bookings for iOS and Android (S7). Not published.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

# Exact pins (CLAUDE.md). Latest stable on 2026-11-04 unless the S7 VALIDATION Part B records why not.
dependencies:
  flutter:
    sdk: flutter
  velio_api:
    path: ../../packages/api-client-dart
  velio_tokens:
    path: ../../packages/design-tokens/dart
  app_links: 7.2.2
  bloc: 9.2.1
  bloc_concurrency: 0.3.0
  connectivity_plus: 7.3.2
  dio: 5.11.1
  equatable: 3.0.0
  flutter_bloc: 9.1.1
  flutter_secure_storage: 11.2.0
  go_router: 18.1.3
  google_maps_flutter: 2.19.0
  image: 4.12.0
  image_picker: 1.2.4
  intl: 0.20.3
  path_parsing: 1.1.0
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  timezone: 0.11.2
  url_launcher: 6.3.3
  uuid: 4.6.0
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: 10.0.0
  fake_async: 1.3.3
  mocktail: 1.0.5
  shared_preferences_platform_interface: 2.4.2
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
