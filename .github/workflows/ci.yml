name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Start Postgres and MinIO
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres minio
          # One-shot: creates the photos bucket (after minio-bucket) and opens photos/ for reading.
          docker compose -f infra/docker-compose.yml run --rm minio-photos-public

      - name: Migrate
        run: bun run db:migrate

      - name: Database types are up to date
        run: bun run db:codegen --verify

      - name: Test
        run: bun test

      - name: Design tokens are up to date
        run: |
          bun run tokens:build
          git diff --exit-code -- packages/design-tokens

      - name: Web tests
        run: bun run web:test

      - name: Web build
        run: bun run web:build

      - name: OpenAPI is up to date
        run: |
          bun run contracts:openapi
          git diff --exit-code -- packages/contracts/openapi.json
