# Local collector: receives OTLP from the API and prints it (debug exporter).
# To also forward to Grafana Cloud, see otel-collector.grafana.yaml.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
  # S8: every signal says where it came from, so Grafana can tell local from production
  # (label `deployment_environment`). Local and production export to the same stack.
  attributes/env:
    actions:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/env, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/env, batch]
      exporters: [debug]
