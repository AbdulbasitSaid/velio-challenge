<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found or error (app)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/velio/tokens.css">
<link rel="stylesheet" href="ds/velio/components/bundle.css">
<script src="ds/velio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#173600}a:hover{color:#0a0a0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--cream); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column">
<div class="vl-appbar">
<a href="F-G8-Code.dc.html" class="vl-iconbtn" aria-label="Close"><svg class="vl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span class="vl-appbar-title"></span>
<span style="width: 44px"></span>
</div>
<main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 20px 64px">
<span style="display: inline-flex; width: 64px; height: 64px; border-radius: 50%; background: var(--surface); color: var(--forest); align-items: center; justify-content: center"><svg class="vl-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px"><path d="{{iconPath}}"></path></svg></span>
<h1 class="title" style="margin: 0">{{headline}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">{{body}}</p>
<sc-if value="{{retry}}" hint-placeholder-val="{{ false }}">
<button class="vl-btn vl-btn-primary vl-btn-block" type="button">Try again</button>
</sc-if>
<sc-if value="{{update}}" hint-placeholder-val="{{ false }}">
<button class="vl-btn vl-btn-primary vl-btn-block" type="button">Update the app</button>
<a class="vl-btn vl-btn-secondary vl-btn-block" href="#">Open in the browser instead</a>
</sc-if>
<a class="vl-btn vl-btn-quiet" href="F-B6-MyPlans.dc.html" style="align-self: center">My plans</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["not found","something broke","link needs a newer app"],"default":"not found"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'not found';
    const v = {
      'not found': { headline: "We can't find that.", body: 'The link may be old or mistyped. Your plans and invites are where you left them.', icon: 'M10.5 17.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM15.5 15.5L20.5 20.5' },
      'something broke': { headline: 'Something went wrong on our side.', body: "It's not you. Try again in a moment.", icon: 'M12 3.5l9.5 16.5h-19zM12 10v4.5M12 17.5h.01' },
      'link needs a newer app': { headline: 'This link needs a newer version of the app.', body: 'Update Velio to open it, or open it in your browser now.', icon: 'M20 11.5A8 8 0 0 0 5.5 7M4 12.5A8 8 0 0 0 18.5 17M5 3.5V7h3.5M19 20.5V17h-3.5' }
    }[k];
    return {
      headline: v.headline, body: v.body, iconPath: v.icon,
      retry: k === 'something broke',
      update: k === 'link needs a newer app'
    };
  }
}
</script>
</body>
</html>
