<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continue (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/velio/tokens.css">
<link rel="stylesheet" href="ds/velio/components/bundle.css">
<script src="ds/velio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#173600}a:hover{color:#0a0a0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--cream); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column">
<header style="display: flex; align-items: center; padding: 14px 20px">
<a class="vl-wordmark" href="#">velio</a>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 20px 32px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="title" style="margin: 0">Continue to Velio</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Your name and a phone number or email. No password.</p>
</div>

<sc-if value="{{serverError}}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="Velio.Banner" tone="error" title="We couldn't sign you in.">Check your connection and try again.</x-import>
</sc-if>

<form style="display: flex; flex-direction: column; gap: 16px">
<x-import component-from-global-scope="Velio.TextField" id="x1-name" label="Your name" value="{{name}}" placeholder="First and last name" help="Others see your first name and last initial."></x-import>
<x-import component-from-global-scope="Velio.TextField" id="x1-contact" label="Phone or email" value="{{contact}}" placeholder="+254 7… or you@example.com" error="{{contactError}}" help="Use the same one on every device to see your plans. We don't message you."></x-import>
<sc-if value="{{submitting}}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="Velio.Button" block="{{yes}}" loading="{{yes}}">Continuing…</x-import>
</sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
<a class="vl-btn vl-btn-primary vl-btn-block" href="B6-MyPlans.dc.html">Continue</a>
</sc-if>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","filled","invalid contact","submitting","server error"],"default":"filled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'filled';
    const filled = s !== 'empty';
    return {
      yes: true,
      name: filled ? 'Tunde Adeyemi' : '',
      contact: s === 'invalid contact' ? 'tunde@' : filled ? 'tunde.adeyemi@example.com' : '',
      contactError: s === 'invalid contact' ? 'Enter a phone number with country code, or a full email address.' : null,
      submitting: s === 'submitting',
      idle: s !== 'submitting',
      serverError: s === 'server error'
    };
  }
}
</script>
</body>
</html>
