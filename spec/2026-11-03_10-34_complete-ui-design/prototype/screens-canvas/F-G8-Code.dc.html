<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter an invite code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/velio/tokens.css">
<link rel="stylesheet" href="ds/velio/components/bundle.css">
<script src="ds/velio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#173600}a:hover{color:#0a0a0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--cream); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column">
<div class="vl-appbar" style="padding: 8px 12px 8px 20px">
<span class="vl-wordmark" style="flex: 1">velio</span>
<a href="F-B6-MyPlans.dc.html" class="vl-btn vl-btn-quiet vl-btn-sm" style="text-decoration: none">My plans</a>
</div>

<main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 20px 32px">
<h1 class="title" style="margin: 0">Got an invite code?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Type the 6 characters from the message your friend sent. Letters and numbers only, no O or 0 to mix up.</p>

<x-import component-from-global-scope="Velio.TextField" id="f-code" label="Invite code" code="{{yes}}" value="{{code}}" placeholder="K7PQ2N" error="{{error}}" disabled="{{limited}}" maxlength="{{six}}"></x-import>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="Velio.Button" block="{{yes}}" loading="{{yes}}">Opening…</x-import>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a class="vl-btn vl-btn-primary vl-btn-block" href="F-G1-Invite.dc.html">Open invite</a>
</sc-if>
<sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
<button class="vl-btn vl-btn-primary vl-btn-block" type="button" disabled>{{waitLabel}}</button>
</sc-if>

<div style="margin-top: auto; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--surface); border-radius: 16px">
<svg class="vl-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--forest)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5.5M12 7.5h.01"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 20px">Got a link instead? Tap it and it opens straight in the app.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","typing","complete","invalid","rate limited","loading"],"default":"complete"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'complete';
    const codes = { empty: '', typing: 'K7P', complete: 'K7PQ2N', invalid: 'K7PQ2M', 'rate limited': 'K7PQ2M', loading: 'K7PQ2N' };
    const limited = s === 'rate limited';
    return {
      yes: true, six: 6,
      code: codes[s],
      limited: limited,
      error: s === 'invalid' ? "That code doesn't match an invite. Check the letters." : limited ? 'Too many attempts from this device. Try again in an hour.' : null,
      loading: s === 'loading',
      ready: s === 'complete' || s === 'invalid',
      waiting: s === 'empty' || s === 'typing' || limited,
      waitLabel: limited ? 'Try again in an hour' : 'Open invite'
    };
  }
}
</script>
</body>
</html>
